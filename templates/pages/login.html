{{/* login.html: fills the "content" hole in layout.html. */}}
{{define "content"}}
<main class="narrow">
  <h1 class="page-title">Log in</h1>

  {{if .Notice}}
  <div class="note" role="status"><p>{{.Notice}}</p></div>
  {{end}}

  {{if .Error}}
  <div class="errors" role="alert"><p>{{.Error}}</p></div>
  {{end}}

  <form class="form" method="post" action="/login">
    {{template "formguard" .FormToken}}
    <div class="field">
      <label for="username">Your name</label>
      <input id="username" name="username" type="text" value="{{.Username}}" required
             autocomplete="username" autocapitalize="none" spellcheck="false"
             placeholder="blue-humming-otter">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>

    <button class="button" type="submit">Log in</button>
  </form>

  <p class="aside">No account yet? <a href="/signup">Make one</a>.<br>
    Lost your password? <a href="/recover">Use a recovery code</a>.</p>
</main>
{{end}}
